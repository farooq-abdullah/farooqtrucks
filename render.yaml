services:
  - type: web
    name: farooqtrucks
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: MAP_USER_AGENT
        sync: false
      - key: LOG_UTC_OFFSET
        value: "-06:00"
